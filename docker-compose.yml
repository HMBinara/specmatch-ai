services:
  backend:
    image: hmbinara/specmatch-backend:v1
    container_name: specmatch-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - neo4j
    networks:
      - specmatch-net
    restart: always

  frontend:
    image: hmbinara/specmatch-frontend:v1
    container_name: specmatch-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - specmatch-net
    restart: always

    neo4j:
    image: neo4j:5.26.0   # latest වෙනුවට stable version එකක්
    container_name: specmatch-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_bolt_advertised__address=13.214.181.51:7687
      - NEO4J_server_http_advertised__address=13.214.181.51:7474
      - NEO4J_dbms_connector_bolt_tls__level=DISABLED
    volumes:
      - neo4j_data:/data
    networks:
      - specmatch-net
    restart: always
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1;"]
      interval: 10s
      timeout: 10s
      retries: 5

networks:
  specmatch-net:
    driver: bridge

volumes:
  neo4j_data: