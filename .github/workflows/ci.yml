name: SpecMatch AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx -r backend/requirements.txt

    - name: Run Pytest Endpoint Tests
      run: |
        pytest backend/tests/

    - name: Build Docker Image
      run: |
        docker build -t specmatch-backend:latest ./backend